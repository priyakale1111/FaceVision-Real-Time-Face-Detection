
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FaceVision | Screenshot Gallery</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #253047;
            padding: 30px 20px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        h1 {
            color: #344e73;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6b7280;
            font-size: 14px;
        }

        .button {
            display: inline-block;
            text-decoration: none;
            border: none;
            border-radius: 8px;
            padding: 11px 16px;
            background: #526f9c;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        .button:hover {
            background: #3d567d;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 22px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }

        .card img {
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            border-radius: 8px;
            display: block;
            background: #e8edf4;
        }

        .filename {
            font-size: 12px;
            color: #6b7280;
            margin: 12px 0;
            overflow-wrap: anywhere;
        }

        .download {
            display: block;
            text-align: center;
            margin-top: 10px;
        }

        .empty {
            background: white;
            padding: 40px 20px;
            border-radius: 12px;
            text-align: center;
            color: #6b7280;
            line-height: 1.8;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 12px;
            }

            header {
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <header>
            <div>
                <h1>FaceVision Gallery</h1>
                <p class="subtitle">View and download your saved screenshots.</p>
            </div>

            <a href="/" class="button">Back to Dashboard</a>
        </header>

        {% if images %}
            <section class="gallery">
                {% for image in images %}
                    <article class="card">
                        <a href="{{ url_for('download_screenshot', filename=image) }}">
                            <img
                                src="{{ url_for('download_screenshot', filename=image) }}"
                                alt="Face detection screenshot"
                                loading="lazy"
                            >
                        </a>

                        <p class="filename">{{ image }}</p>

                        <a
                            class="button download"
                            href="{{ url_for('download_screenshot', filename=image) }}"
                        >
                            Download Screenshot
                        </a>
                    </article>
                {% endfor %}
            </section>
        {% else %}
            <section class="empty">
                <h2>No screenshots yet</h2>
                <p>Go to the dashboard, start the camera, and save a screenshot.</p>
                <br>
                <a href="/" class="button">Open Dashboard</a>
            </section>
        {% endif %}
    </main>
</body>
</html>
